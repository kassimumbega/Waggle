<style>
:root{--honey:#f2a900;--honey-h:#dc9a00;--honey-soft:#fff4d6;--ink:#1f2328;--mut:#6b7280;--line:#e6e6e1;--bg:#f6f6f3;--card:#fff;--side:#fbfaf7;--ok:#1f9d55;--ok-soft:#e5f6ec;--bad:#d64531;--bad-soft:#fde8e4;--blue:#2d7ff9;--r:12px;--sh:0 1px 2px rgba(16,24,40,.05)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.5 Inter,"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--honey);outline-offset:2px}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.2}h1{font-size:30px}h2{font-size:22px}h3{font-size:16px}
.mut{color:var(--mut)}.sm{font-size:12.5px}.b{font-weight:700}.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;background:var(--honey);border:1px solid var(--honey);color:#1f2328;padding:9px 16px;border-radius:9px;font-weight:600;transition:background .15s}
.btn:hover:not(:disabled){background:var(--honey-h)}
.btn.o{background:#fff;border-color:var(--line)}.btn.o:hover:not(:disabled){background:#f7f7f4}
.btn.g{background:transparent;border-color:transparent;color:var(--mut)}.btn.g:hover:not(:disabled){color:var(--ink);background:#efefeb}
.btn.dk{background:#1f2328;border-color:#1f2328;color:#fff}.btn.dk:hover:not(:disabled){background:#000}
.btn.sm2{padding:6px 11px;font-size:13px}.btn.block{width:100%}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#eee;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.hn{background:var(--honey-soft);color:#8a5d00}.tag.bl{background:#e8f0ff;color:var(--blue)}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid #d9d9d3;border-radius:9px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--honey);box-shadow:0 0 0 3px rgba(242,169,0,.18)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--honey)}
label.f{display:block;font-size:12.5px;font-weight:600;color:#374151;margin:12px 0 5px}
.seg{display:inline-flex;background:#efefeb;border-radius:9px;padding:3px;gap:2px}.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;color:var(--mut);font-weight:600}.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-weight:600;color:#374151}.chip.on{background:var(--honey);border-color:var(--honey);color:#1f2328}
.bar{height:6px;background:#ecece7;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--honey)}.bar.bad i{background:var(--bad)}

.av-stack span{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#f2a900;border:2px solid #fff;color:#1f2328;font-size:11px;font-weight:800;margin-left:-8px}
.av-stack span:first-child{margin-left:0}
.auth-right{background:#f7f6f2;display:grid;place-items:center;padding:32px 20px}
.auth-card{width:100%;max-width:440px;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:28px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:#f3ead0;border-radius:99px;padding:4px}
.auth-tabs button{border:0;background:none;padding:10px;border-radius:99px;font-weight:700;cursor:pointer;color:#4b5563}
.auth-tabs button.on{background:#fff;color:#1f2328;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.social{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.or{text-align:center;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 4px}
.pw{position:relative}.pw input{width:100%;padding-right:64px}
.pw-t{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:#8a5d00;font-weight:700;cursor:pointer}
.lnk{color:#8a5d00;font-weight:700}
.linkbtn{border:0;background:none;color:#8a5d00;font-weight:700;cursor:pointer;padding:0}
.auth-foot{margin-top:22px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.auth-card h1{margin-top:22px}

/* ---- Phone layout (under 600px) ---- */
@media (max-width:600px){
 .top{padding:10px 14px;gap:8px}
 .top .search{display:none}
 .tr>button:first-child{display:none}
 .main{padding:18px 14px 110px}
 .page-h{flex-direction:column;align-items:flex-start;gap:10px;margin-bottom:14px}
 .page-h h1{font-size:26px;line-height:1.15}
 .card{padding:14px}
 .g4,.kstrip{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px}
 .g2,.g3,.two,.mk{grid-template-columns:minmax(0,1fr)!important}
 .pgrid-pos{grid-template-columns:repeat(2,minmax(0,1fr))!important}
 input:not([type=checkbox]):not([type=radio]),select,textarea{max-width:100%;min-width:0;width:100%}
 .row{flex-wrap:wrap}
 .fab-cart{right:12px;bottom:12px;padding:10px 14px;font-size:14px}
 table{display:block;overflow-x:auto;max-width:100%}
}

const EMPTY={user:null,org:null,apiaries:[],inv:[],orders:[],sales:[],cart:[],pcart:[],wl:[],drafts:{},history:{},reviews:{},cal:[],act:[],tasks:[],team:[],seller:null,seq:1100};

let D=clone(EMPTY);
const API={
 async call(method,url,body){
  const r=await fetch(url,{method,credentials:"same-origin",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){const err=new Error(j.error||("Request failed ("+r.status+")"));err.status=r.status;throw err}
  return j;
 }
};
let SAVE_T=null,SAVE_PENDING=false;
function stateForServer(){const s=Object.assign({},D);delete s.user;return s}
function persist(){SAVE_PENDING=true;clearTimeout(SAVE_T);SAVE_T=setTimeout(()=>flushSave(false),400)}
function flushSave(leaving){
 if(!SAVE_PENDING||!D.user)return;
 SAVE_PENDING=false;clearTimeout(SAVE_T);
 fetch("/api/state",{method:"PUT",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(stateForServer()),keepalive:!!leaving})
  .then(r=>{if(!r.ok)throw new Error("save failed")})
  .catch(()=>{SAVE_PENDING=true;toast("Could not save your changes. Check your connection.",true)});
}
window.addEventListener("pagehide",()=>flushSave(true));
const log=(m,bad)=>{D.act.unshift({m,bad:!!bad,at:Date.now()});D.act=D.act.slice(0,30)};
const ago=t=>{const m=Math.round((Date.now()-t)/60000);return m<1?"just now":m<60?m+"m ago":m<1440?Math.round(m/60)+"h ago":Math.round(m/1440)+"d ago"};
const allHives=()=>D.apiaries.flatMap(a=>a.hives.map(h=>({...h,apiary:a.id})));
const findHive=id=>{for(const a of D.apiaries){const h=a.hives.find(x=>x.id===id);if(h)return{a,h}}return null};
const findApiary=id=>D.apiaries.find(a=>a.id===id);
const lowStock=p=>p.qty<=p.min;

/* ---- routing ---- */
const V={};              // per-page transient UI state
const PROTECTED=["/setup","/dash","/apiary","/apiaries","/hives","/inspect","/inventory","/pos","/tasks","/settings"];
function route(){
 const h=(location.hash||"#/").slice(1),parts=h.split("/").filter(Boolean),key="/"+(parts[0]||"");
 if(PROTECTED.includes(key)&&!D.user){location.hash="#/auth";return}
 if(key==="/auth"&&D.user){location.hash="#/dash";return}
 let html;
 if(key==="/"||key==="/home")html=landing();
 else if(key==="/auth")html=authPage();
 else if(key==="/setup")html=setupPage();
 else if(key==="/dash")html=dashPage();
 else if(key==="/market")html=marketPage();
 else if(key==="/product")html=productPage(parts[1]);
 else if(key==="/apiary")html=apiaryPage(parts[1]);
 else if(key==="/inspect")html=inspectPage(parts[1]);
 else if(key==="/inventory")html=inventoryPage();
 else if(key==="/pos")html=posPage();
 else if(key==="/apiaries")html=apiariesPage();
 else if(key==="/hives")html=hivesPage();
 else if(key==="/tasks")html=tasksPage();
 else if(key==="/settings")html=settingsPage();
 else if(key==="/seller")html=sellerPage();
 else if(key==="/forgot")html=forgotPage();
 else html=`<div class="empty"><h2>Page not found</h2><p><a href="#/" style="color:#8a5d00;font-weight:700">Back to home</a></p></div>`;
 const bare=key==="/"||key==="/auth"||key==="/forgot"||(key==="/seller"&&!D.user);
 if(key==="/seller"&&bare){html=`<div class="lp" style="min-height:0;padding:20px 16px;max-width:920px;margin:0 auto"><p style="margin:0 0 16px"><a href="#/" style="color:#8a5d00;font-weight:700">← Back to Waggle</a></p>${html}</div>`}
 if(bare){$("#root").innerHTML=html}
 else{$("#root").innerHTML=shell(key,html)}
 window.scrollTo(0,0);
 afterRender(key,parts);
 applyLang();
}
function go(h){if(location.hash===h){route()}else location.hash=h}
function nav(key){
 const oc=openTasks();const items=[["/dash",tr("nav_dash"),"▦"],["/market",tr("nav_market"),"🛍"],["/apiaries",tr("nav_apiaries"),"⬡"],["/hives",tr("nav_hives"),"🐝"],["/inventory",tr("nav_inv"),"▤"],["/pos",tr("nav_pos"),"💳"],["/tasks",tr("nav_tasks")+(oc?` <span class="cnt">${oc}</span>`:""),"✔"],["/settings",tr("nav_settings"),"⚙"]];
 return items.map(([p,l,i])=>{const on=p===key||(p==="/apiaries"&&key==="/apiary")||(p==="/hives"&&key==="/inspect");return `<a href="#${p}" class="${on?"on":""}" ${on?'aria-current="page"':""}><span>${i}</span>${l}</a>`}).join("")+langSwitch()
}
function shell(key,body){
 const nm=D.user?D.user.name:"Guest";
 const org=D.org?esc(D.org.name):"Waggle";
 const unread=Math.max(0,D.act.length-(V.bellSeen||0));const cartN=D.cart.reduce((s,c)=>s+c.n,0);
 return `<header class="top"><a href="#/dash" class="logo"><img class="logo-img" src="${LOGO_SRC}" alt="">${org}</a>
  <div class="search"><input type="search" id="gsearch" placeholder="Search hives, orders, products…" aria-label="Search" data-gs></div>
  <div class="tr" style="position:relative"><button class="btn g sbtn" data-act="support">Support</button><button class="btn g sbtn bellbtn" data-act="bell" aria-label="Notifications, ${unread} unread">🔔${unread?`<span class="dot">${unread}</span>`:""}</button><button class="avatar" data-act="umenu" aria-label="Account menu" aria-expanded="${!!V.umenu}" title="${esc(nm)}">${initials(nm)}</button>${V.bell?bellPanel():""}${V.umenu?umenuPanel():""}
</div></header>
 <div class="shell"><aside class="side" aria-label="Main">${nav(key)}
  <div class="foot"><b>Pro Plan</b><div class="sm mut" style="margin:4px 0 8px">${allHives().length} of 30 hives used</div><div class="bar"><i style="width:${Math.min(100,allHives().length/30*100)}%"></i></div></div></aside>
  <main class="main" id="main">${body}</main></div>
 <a href="#/market" class="fab-cart" aria-label="Open marketplace cart, ${cartN} items">🛒 Cart · ${cartN}</a>`;
}

/* ---- global handlers ---- */
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-go],[data-signout],[data-act]");if(!t)return;
 if(t.dataset.go){e.preventDefault();go(t.dataset.go)}
 if(t.hasAttribute("data-signout")){signOut()}
 if(t.dataset.act){const fn=ACTS[t.dataset.act];if(fn){fn(t)}}
});
document.addEventListener("submit",e=>{const f=e.target;if(f.dataset.form){e.preventDefault();const fn=FORMS[f.dataset.form];if(fn)fn(f)}});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.live){const fn=LIVE[t.dataset.live];if(fn)fn(t)}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.chg){const fn=LIVE[t.dataset.chg];if(fn)fn(t)}});
window.addEventListener("hashchange",()=>{V.bell=false;V.umenu=false;route()});

 ][s-1];

function wizCollect(){const f=document.querySelector('form[data-form="wizard"]');if(!f)return;new FormData(f).forEach((v,k)=>WZ.d[k]=v);const l=f.querySelector("#logo");}

FORMS.wizard=f=>{wizCollect();const s=WZ.s,d=WZ.d;
 if(s===1&&!(d.name||"").trim()){toast("Enter an organization name",true);return}
 if(s===2&&!(d.an||"").trim()){toast("Enter an apiary name",true);return}

function revSeries(rg){
 const now=new Date(),key=d=>d.toISOString().slice(0,10),paid=D.orders.filter(o=>o.st!=="Cancelled");
 const b=[];
 if(rg==="Day"){for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);b.push({l:d.toLocaleDateString("en-GB",{weekday:"short"}),from:key(d),to:key(d)})}}
 else if(rg==="Week"){for(let i=3;i>=0;i--){const e=new Date(now);e.setDate(e.getDate()-i*7);const st=new Date(e);st.setDate(st.getDate()-6);b.push({l:st.toLocaleDateString("en-GB",{day:"numeric",month:"short"}),from:key(st),to:key(e)})}}
 else{const n=rg==="Year"?12:6;for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const e=new Date(d.getFullYear(),d.getMonth()+1,0);b.push({l:d.toLocaleDateString("en-GB",{month:"short"}),from:key(d),to:key(e)})}}
 return {l:b.map(x=>x.l),r:b.map(x=>paid.filter(o=>o.date>=x.from&&o.date<=x.to).reduce((s,o)=>s+o.amt,0)/1000),c:[]};
}
function chartSvg(R){
 const W=640,H=220,P=34,mx=Math.max(1,...R.r,...R.c)*1.15,n=R.r.length;
 const x=i=>P+i*(W-P-12)/(n-1),y=v=>H-26-v/mx*(H-40);
 const pts=a=>a.map((v,i)=>x(i)+","+y(v)).join(" ");
 const grid=[0,1,2,3].map(i=>{const gy=26+i*(H-52)/3;return `<line x1="${P}" x2="${W-8}" y1="${gy}" y2="${gy}" stroke="#eee"/>`}).join("");
 const dots=R.r.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#f2a900"><title>${R.l[i]}: ${TZS(v*1000)}</title></circle><text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="#6b7280">${R.l[i]}</text>`).join("");
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Revenue for ${R.l[0]} to ${R.l[n-1]}">${grid}<polyline fill="none" stroke="#f2a900" stroke-width="2.5" points="${pts(R.r)}"/>${R.c.length?`<polyline fill="none" stroke="#d64531" stroke-width="2" stroke-dasharray="5 4" points="${pts(R.c)}"/>`:""}${dots}</svg>`;
}

/* ===== Hive inspection ===== */
const INSP_DEF=h=>({date:today(),time:new Date().toTimeString().slice(0,5),entrance:"Normal",odor:"Sweet",notes:"",queen:"Yes",pattern:"Solid",eggs:true,larvae:true,swarm:"None",mites:0,pest:30,disease:[],temper:"Calm",frames:h.f,honey:"Medium",photos:[],followup:"",treat:""});
const DISEASES=[["Chalkbrood",10],["Sacbrood",10],["American Foulbrood (AFB)",40],["Deformed Wing Virus",10]];
function scoreInsp(f){let s=100;const flags=[];const q=f.queen==="Yes";
 if(!q){s-=40;flags.push("No queen seen")}
 if(f.pattern==="Spotty"){s-=15;flags.push("Spotty brood pattern")}
 if(f.pattern==="None"){s-=q?20:10;flags.push("No capped brood")}
 const m=+f.mites||0;if(m>=3){s-=25;flags.push("High mite count ("+m+"/100 bees)")}else if(m>=1){s-=10;flags.push("Some mites seen")}
 if(f.pest>60){s-=15;flags.push("High pest pressure")}
 if(f.swarm==="Swarm cells"){s-=10;flags.push("Swarm cells present")}
 if(f.swarm==="Supersedure"){s-=5;flags.push("Supersedure cells")}
 if(f.temper==="Aggressive"){s-=5;flags.push("Aggressive colony")}
 if(f.honey==="Low"){s-=10;flags.push("Low honey stores")}
 (f.disease||[]).forEach(d=>{const x=DISEASES.find(v=>v[0]===d);if(x){s-=x[1];flags.push(d)}});
 s=Math.max(0,s);
 const dis=(f.disease||[]).some(d=>d.startsWith("American"));
 const st=!q?"Queenless":dis?"Disease: report":m>=3?"Mites suspected":f.swarm==="Swarm cells"?"Swarm risk":s<60?"Needs attention":"Healthy";
 const frames=Math.max(0,Math.min(10,Math.round(s/10)));
 return{score:s,status:st,flags,frames}}
function inspectPage(id){
 const r=findHive(id);if(!r)return notFound("Hive not found");const {a,h}=r;
 if(!V.fi||V.fid!==id){V.fid=id;V.fi=D.drafts[id]?JSON.parse(JSON.stringify(D.drafts[id])):INSP_DEF(h);V.done=V.done&&V.done.id===id?V.done:null}
 if(V.done&&V.done.id===id){const d=V.done;return `<div class="crumbs"><a href="#/dash">Dashboard</a> / <a href="#/apiary/${a.id}">${esc(a.name)}</a> / ${h.id} / Summary</div><div class="card" style="max-width:720px;margin:0 auto"><span class="tag ${d.status==="Healthy"?"ok":"bad"}">${esc(d.status)}</span><h1 style="margin-top:10px">Inspection saved for ${h.id}</h1><p class="mut">Recorded on ${d.date}. Your inspection draft has been cleared.</p>
  <div class="grid g3" style="margin:16px 0"><div class="card"><div class="sm mut">Score</div><div class="score num">${d.score}<span class="sm mut"> /100</span></div></div><div class="card"><div class="sm mut">Frames of brood</div><div class="score num">${d.frames}<span class="sm mut"> /10</span></div></div><div class="card"><div class="sm mut">Follow-up</div><div class="b">${d.followup?esc(d.followup):"Not set"}</div></div></div>
  <h3>Flags</h3>${d.flags.length?`<ul>${d.flags.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p class="mut">No issues flagged.</p>`}
  <div class="row" style="margin-top:16px"><a class="btn o" href="#/apiary/${a.id}">Back to apiary</a><button class="btn o" data-act="mktask" data-v="${h.id}">Create task</button><button class="btn" data-act="newinsp" data-v="${h.id}">Inspect another hive</button></div></div>`}
 const f=V.fi,{score,status,flags}=scoreInsp(f);
 const opt=(k,v,lbl,sub)=>`<button type="button" class="opt ${f[k]===v?"on":""}" data-act="iopt" data-k="${k}" data-v="${esc(v)}" aria-pressed="${f[k]===v}">${esc(lbl||v)}${sub?`<small>${esc(sub)}</small>`:""}</button>`;
 const ck=(k,l)=>`<label class="ck"><input type="checkbox" data-chg="ichk" data-k="${k}" ${f[k]?"checked":""}> ${l}</label>`;
 const dis=(d)=>`<label class="ck"><input type="checkbox" data-chg="idis" data-v="${esc(d)}" ${(f.disease||[]).includes(d)?"checked":""}> ${esc(d)}</label>`;
 return `<div class="crumbs"><a href="#/dash">Dashboard</a> / <a href="#/apiary/${a.id}">${esc(a.name)}</a> / ${h.id} / Inspection</div>
 <div class="page-h" style="margin-bottom:14px"><div><h1 style="font-size:26px">Standard inspection: ${h.id}</h1><div class="sm mut" style="margin-top:4px">${esc(a.name)} · ${h.type} · current status <span class="tag ${h.st==="Healthy"?"ok":"bad"}">${h.st}</span> ${D.drafts[id]?'<span class="tag bl">Draft restored</span>':""}</div></div>
  <div class="row" style="gap:8px"><button class="btn o sbtn" data-act="draftsave">Save draft</button><button class="btn sbtn" form="inspform" id="submitbtn">Submit report</button></div></div>
 <form id="inspform" data-form="inspect" class="insp" novalidate><div class="stack">
  <div class="card sec-c"><h3>General observations</h3><p>Conditions you saw when you opened the hive.</p>
   <div class="two" style="margin-top:6px"><div><label class="f">Date</label><input type="date" name="date" data-live="ifield" data-k="date" value="${f.date}" required></div><div><label class="f">Time</label><input type="time" data-live="ifield" data-k="time" value="${f.time}"></div></div>
   <label class="f">Entrance activity</label><div class="opts">${["Low","Normal","High"].map(v=>opt("entrance",v)).join("")}</div>
   <label class="f">Odour</label><div class="opts">${[["Sweet","Sweet / normal"],["Foul","Foul / sour"]].map(v=>opt("odor",v[0],v[1])).join("")}</div>
   <label class="f" for="inotes">Environmental notes</label><textarea id="inotes" data-live="ifield" data-k="notes" rows="2" placeholder="e.g. Wind today, forage nearby">${esc(f.notes)}</textarea></div>
  <div class="card sec-c"><h3>Queen and brood</h3><p>What you saw inside the colony.</p>
   <label class="f">Did you see the queen?</label><div class="opts">${opt("queen","Yes","Yes")}${opt("queen","No","No")}</div>
   <label class="f">Brood pattern</label><div class="opts">${opt("pattern","Solid","Solid","Compact, even capping")}${opt("pattern","Spotty","Spotty","Uneven capping")}${opt("pattern","None","None","No capped brood")}</div>
   <label class="f">Seen in the frames</label><div class="opts" style="gap:14px">${ck("eggs","Eggs")}${ck("larvae","Larvae")}</div>
   <label class="f">Queen cells</label><div class="opts">${["None","Swarm cells","Supersedure"].map(v=>opt("swarm",v)).join("")}</div>
   <div class="two"><div><label class="f" for="ifr">Frames of brood (0–10)</label><input id="ifr" type="number" min="0" max="10" data-live="ifield" data-k="frames" value="${f.frames}"></div><div><label class="f">Honey stores</label><div class="opts">${["Low","Medium","High"].map(v=>opt("honey",v)).join("")}</div></div></div></div>
  <div class="card sec-c" style="border-color:#f1c4bd"><h3>Pests and disease</h3><p>Check everything you found.</p>
   <div class="two" style="margin-top:6px"><div><label class="f" for="imite">Varroa mites per 100 bees</label><input id="imite" type="number" min="0" data-live="ifield" data-k="mites" value="${f.mites}"><div class="sm mut" style="margin-top:4px">Level: ${(+f.mites||0)>=3?"<b style='color:var(--bad)'>High</b>":(+f.mites||0)>=1?"Watch":"Safe"}</div></div>
    <div><label class="f" for="ipest">Pest pressure: ${f.pest}%</label><input id="ipest" type="range" min="0" max="100" data-live="ifield" data-k="pest" value="${f.pest}"></div></div>
   <label class="f">Signs of disease</label>${DISEASES.map(d=>dis(d[0])).join("")}
   <label class="f" for="itreat">Treatment applied</label><input id="itreat" data-live="ifield" data-k="treat" value="${esc(f.treat)}" placeholder="e.g. Formic acid strip, none">
  </div>
  <div class="card sec-c"><h3>Photos</h3><p>Up to 4 photos, 300 KB each. Photos stay in this browser draft only.</p>
   <div class="photos">${f.photos.map((p,j)=>`<div><img src="${p}" alt="Inspection photo ${j+1}"><button type="button" data-act="iphoto" data-v="${j}" aria-label="Remove photo ${j+1}">×</button></div>`).join("")}${f.photos.length<4?`<label class="addph" for="iphf"><input id="iphf" type="file" accept="image/*" multiple style="display:none" data-chg="iphoto">+ Add photo</label>`:""}</div></div>
  <div class="card sec-c"><h3>Follow-up</h3><div class="two"><div><label class="f" for="ifu">Follow-up date</label><input id="ifu" type="date" data-live="ifield" data-k="followup" value="${esc(f.followup)}"></div></div></div>
 </div>
 <aside class="stack" style="position:sticky;top:76px"><div class="card" style="background:var(--honey-soft);border-color:#f0d27a"><h3>Inspection summary</h3><div class="score num" id="iscore" style="margin:6px 0">${score}<span class="sm mut"> /100</span></div><span class="tag ${status==="Healthy"?"ok":"bad"}" id="istatus">${esc(status)}</span>
  <div id="iflags" class="sm" style="margin-top:10px">${flags.length?`<ul style="padding-left:18px;margin:0">${flags.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:'<span class="mut">No issues flagged.</span>'}</div>
  <p class="sm mut" style="margin-top:10px">Scores are a guide from this form. Confirm serious findings with your extension officer.</p></div>
  <div class="card"><b class="sm">AI-style recommendations (rule-based)</b><div class="sm" style="margin-top:6px">${recs(f,flags).map(r=>`<div style="padding:6px 0;border-top:1px solid var(--line)">${esc(r)}</div>`).join("")}</div></div>
  <div class="card"><label class="f" for="istat" style="margin-top:0">Override status</label><select id="istat" data-chg="ifield" data-k="statusOverride"><option value="">Use calculated status</option>${["Healthy","Mites suspected","Queenless","Swarm risk","Needs attention","Disease: report"].map(v=>`<option ${f.statusOverride===v?"selected":""}>${v}</option>`).join("")}</select></div>
   <div class="card"><div class="sm mut">Last inspection</div><b>${h.last}</b><div class="row" style="margin-top:10px;gap:8px"><button type="button" class="btn g sbtn" data-act="cancelinsp">Cancel changes</button><a class="btn o sbtn" href="#/apiary/${a.id}">Back to apiary</a></div></div>
 </aside></form>`;
}
function recs(f,flags){const r=[];if((+f.mites||0)>=3)r.push("Treat for mites now. Use a formic acid or oxalic acid treatment and recheck in 7 days.");else if((+f.mites||0)>=1)r.push("Monitor mites at the next visit.");
 if(f.queen==="No")r.push("No queen seen: check for queen cells or a laying worker before the next visit.");
 if(f.honey==="Low")r.push("Low honey stores: consider feeding 1:1 sugar syrup.");
 if((f.disease||[]).some(d=>d.startsWith("American")))r.push("Possible AFB: isolate equipment and report to your extension officer. Do not move frames.");
 if(f.swarm==="Swarm cells")r.push("Swarm cells: split the colony or add space.");
 if(!r.length)r.push("No action needed. Recheck at the next scheduled inspection.");return r}
LIVE.ifield=t=>{if(!V.fi)return;const k=t.dataset.k;V.fi[k]=t.type==="number"||t.type==="range"?(t.value===""?"":+t.value):t.value;
 if(k==="frames"){V.fi.frames=Math.max(0,Math.min(10,+t.value||0))}
 const r=scoreInsp(V.fi);const s=$("#iscore");if(s)s.innerHTML=r.score+'<span class="sm mut"> /100</span>';const st=$("#istatus");if(st){st.textContent=r.status;st.className="tag "+(r.status==="Healthy"?"ok":"bad")}
 const fl=$("#iflags");if(fl)fl.innerHTML=r.flags.length?`<ul style="padding-left:18px;margin:0">${r.flags.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:'<span class="mut">No issues flagged.</span>'};
ACTS.iopt=t=>{if(!V.fi)return;V.fi[t.dataset.k]=t.dataset.v;route()};
document.addEventListener("change",e=>{const t=e.target;if(!V.fi)return;
 if(t.dataset.chg==="ichk"){V.fi[t.dataset.k]=t.checked;LIVE.ifield(t);route()}
 if(t.dataset.chg==="idis"){const v=t.dataset.v;V.fi.disease=V.fi.disease||[];const i=V.fi.disease.indexOf(v);if(t.checked&&i<0)V.fi.disease.push(v);if(!t.checked&&i>=0)V.fi.disease.splice(i,1);route()}
 if(t.dataset.chg==="ifield"&&t.dataset.k==="statusOverride"){V.fi.statusOverride=t.value}
 if(t.dataset.chg==="iphoto"){const files=[...t.files];const room=4-(V.fi.photos||[]).length;if(room<=0)return toast("Maximum 4 photos",true);
  let added=0;files.slice(0,room).forEach(f=>{if(f.size>300*1024){toast(f.name+" is over 300 KB",true);return}const r=new FileReader();r.onload=()=>{V.fi.photos.push(r.result);route()};r.onerror=()=>toast("Could not read "+f.name,true);r.readAsDataURL(f);added++});
  if(files.length>room)toast("Only "+room+" more photo"+(room>1?"s":"")+" allowed",true)}});
ACTS.iphoto=t=>{V.fi.photos.splice(+t.dataset.v,1);route()};
ACTS.draftsave=()=>{D.drafts[V.fid]=JSON.parse(JSON.stringify(V.fi));persist();toast("Draft saved")};
ACTS.newinsp=t=>{V.fid=null;V.done=null;go("#/inspect/"+t.dataset.v)};
FORMS.inspect=f=>{const id=V.fid,r=findHive(id);if(!r)return toast("Hive not found",true);const fi=V.fi;
 if(!fi.date)return toast("Choose the inspection date",true);
 if(fi.mites!==""&&(+fi.mites<0||+fi.mites>100))return toast("Mite count must be 0 to 100",true);
 const sc=scoreInsp(fi);const st=fi.statusOverride||sc.status;const fr=sc.frames;
 const h=r.h;h.st=st==="Healthy"?"Healthy":(st==="Disease: report"||st==="Queenless")?"Alert":"Warning";h.q=sc.score>=75&&fi.queen==="Yes"?"Strong":sc.score>=50?"Medium":"Weak";h.f=fr;h.last=fi.date;h.health=sc.score;
 (D.history[id]=D.history[id]||[]).unshift({date:fi.date,score:sc.score,status:st,frames:fr,flags:sc.flags,photos:fi.photos.length});
 delete D.drafts[id];log("Inspection "+id+": "+st+", score "+sc.score,st!=="Healthy");persist();
 V.done={id,score:sc.score,status:st,frames:fr,flags:sc.flags,date:fi.date,followup:fi.followup};V.fi=null;toast("Inspection saved");route()};


/* ===== Extra data (defaults for older saved data) ===== */
D.tasks=D.tasks||[];D.team=D.team||[];D.seller=D.seller||null;
const ROLES=["Owner","Administrator","Field inspector","Sales","Inventory manager","Viewer"];
const openTasks=()=>D.tasks.filter(t=>!t.done).length;

/* ===== Apiaries list ===== */
const AP=()=>V.apl||(V.apl={add:false,q:""});
function apiariesPage(){
 const f=AP(),q=f.q.toLowerCase();
 const list=D.apiaries.filter(a=>!q||(a.name+" "+a.loc+" "+(a.code||"")).toLowerCase().includes(q));
 return `<div class="page-h"><div><h1>Apiaries</h1><p class="mut" style="margin:6px 0 0">${D.apiaries.length} apiaries · ${allHives().length} hives. Open an apiary to see its map, hives and inspections.</p></div>
  <div class="row" style="gap:8px"><input type="search" data-live="apq" value="${esc(f.q)}" placeholder="Search apiaries" aria-label="Search apiaries" style="width:240px"><button class="btn" data-act="aptog">${f.add?"Close form":"+ Add apiary"}</button></div></div>
 ${f.add?`<form class="card" data-form="addapiary" novalidate style="margin-bottom:16px"><h3>New apiary</h3><div class="grid g3" style="margin-top:8px">
  <div><label class="f" for="aa_n">Apiary name *</label><input id="aa_n" name="name" required maxlength="60"></div>
  <div><label class="f" for="aa_l">Location *</label><input id="aa_l" name="loc" required placeholder="e.g. Moshi, Tanzania"></div>
  <div><label class="f" for="aa_c">Apiary code</label><input id="aa_c" name="code" placeholder="e.g. NJ-03"></div>
  <div><label class="f" for="aa_m">Responsible beekeeper</label><input id="aa_m" name="manager" value="${esc(D.user?D.user.name:"")}"></div>
  <div><label class="f" for="aa_la">Latitude (optional)</label><input id="aa_la" name="lat" placeholder="-3.35"></div>
  <div><label class="f" for="aa_lo">Longitude (optional)</label><input id="aa_lo" name="lon" placeholder="37.34"></div></div>
  <div class="row" style="margin-top:12px"><span class="sm mut">Coordinates are stored as entered and are not checked against a map service.</span><button class="btn">Save apiary</button></div></form>`:""}
 <div class="grid g3">${list.map(a=>{const n=a.hives.length,ok=a.hives.filter(h=>h.st==="Healthy").length,need=n-ok;return `<div class="card stack"><div class="row"><div><h3>${esc(a.name)}</h3><div class="sm mut">${esc(a.loc)} · ${esc(a.code||"No code")}</div></div><span class="tag ${need?"bad":"ok"}">${need?need+" need attention":"All healthy"}</span></div>
  <div class="grid g3" style="gap:8px"><div><div class="sm mut">Hives</div><b class="num">${n}</b></div><div><div class="sm mut">Healthy</div><b class="num">${ok}</b></div><div><div class="sm mut">Manager</div><b class="sm">${esc(a.manager||"—")}</b></div></div>
  <div class="bar"><i style="width:${n?Math.round(ok/n*100):0}%"></i></div>
  <div class="row"><a class="btn sbtn" href="#/apiary/${a.id}">Open apiary</a><span class="row" style="gap:6px;justify-content:flex-end"><button class="btn o sbtn" data-act="apedit" data-v="${a.id}">Edit</button><button class="btn g sbtn" data-act="apdel" data-v="${a.id}">Remove</button></span></div></div>`}).join("")||`<div class="card empty" style="grid-column:1/-1"><h3>No apiaries match</h3><p>Clear the search or add an apiary.</p></div>`}</div>`;
}
ACTS.aptog=()=>{AP().add=!AP().add;route()};
LIVE.apq=t=>{AP().q=t.value;const p=t.selectionStart;route();const n=document.querySelector('[data-live="apq"]');if(n){n.focus();n.setSelectionRange(p,p)}};
FORMS.addapiary=f=>{const name=f.name.value.trim(),loc=f.loc.value.trim();
 if(!name)return toast("Enter an apiary name",true);if(!loc)return toast("Enter a location",true);
 let gps=null;const la=f.lat.value.trim(),lo=f.lon.value.trim();
 if(la||lo){const a=+la,o=+lo;if(!la||!lo||isNaN(a)||isNaN(o)||a<-90||a>90||o<-180||o>180)return toast("Enter valid coordinates, or leave both blank",true);gps=[a,o]}
 D.apiaries.push({id:uid("ap"),name,loc,code:f.code.value.trim()||("AP-"+(D.apiaries.length+1)),gps,manager:f.manager.value.trim()||D.user.name,est:today(),hives:[]});
 log("Created apiary "+name);persist();AP().add=false;toast("Apiary created");route()};

/* ===== Hives (all apiaries) ===== */
const HV=()=>V.hv||(V.hv={q:"",ap:"All",st:"All",edit:null,add:false});
function hivesPage(){
 const f=HV(),q=f.q.toLowerCase();
 const rows=D.apiaries.flatMap(a=>a.hives.map(h=>({h,a}))).filter(({h,a})=>(f.ap==="All"||a.id===f.ap)&&(f.st==="All"||(f.st==="Healthy"?h.st==="Healthy":h.st!=="Healthy"))&&(h.id+" "+h.st+" "+h.type+" "+a.name).toLowerCase().includes(q));
 const edit=f.edit?findHive(f.edit):null;
 return `<div class="page-h"><div><h1>Hives</h1><p class="mut" style="margin:6px 0 0">${allHives().length} hives across ${D.apiaries.length} apiaries. Edit a hive's condition or add new hives.</p></div>
  <button class="btn" data-act="hvaddtog">${f.add?"Close form":"+ Add new"}</button></div>
 ${f.add?`<form class="card" data-form="addhive2" novalidate style="margin-bottom:16px"><h3>Add hives</h3><div class="grid g3" style="margin-top:8px"><div><label class="f" for="ha_a">Apiary *</label><select id="ha_a" name="apiary">${D.apiaries.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join("")}</select></div><div><label class="f" for="ha_t">Hive type</label><select id="ha_t" name="type"><option>Langstroth</option><option>Top Bar</option><option>Log hive</option></select></div><div><label class="f" for="ha_n">How many (1–20)</label><input id="ha_n" name="n" type="number" min="1" max="20" value="1"></div></div><div class="row" style="margin-top:12px"><span class="sm mut">Hive IDs are generated automatically.</span><button class="btn">Add hives</button></div></form>`:""}
 ${edit?`<form class="card" data-form="edithive" novalidate style="margin-bottom:16px;border-color:var(--honey)"><div class="row"><h3>Edit ${edit.h.id} <span class="sm mut">· ${esc(edit.a.name)}</span></h3><button type="button" class="btn g sbtn" data-act="hvcancel">Cancel</button></div>
  <div class="grid g4" style="margin-top:8px"><div><label class="f" for="he_t">Hive type</label><select id="he_t" name="type">${["Langstroth","Top Bar","Log hive"].map(v=>`<option ${edit.h.type===v?"selected":""}>${v}</option>`).join("")}</select></div>
  <div><label class="f" for="he_q">Queen strength</label><select id="he_q" name="q">${["Strong","Medium","Weak"].map(v=>`<option ${edit.h.q===v?"selected":""}>${v}</option>`).join("")}</select></div>
  <div><label class="f" for="he_s">Status</label><select id="he_s" name="st">${["Healthy","Warning","Alert","Queenless"].map(v=>`<option ${edit.h.st===v?"selected":""}>${v}</option>`).join("")}</select></div>
  <div><label class="f" for="he_f">Brood frames (0–10)</label><input id="he_f" name="f" type="number" min="0" max="10" value="${edit.h.f}"></div></div>
  <div class="row" style="margin-top:12px"><span class="sm mut">Changing status here does not create an inspection record. Use Inspect for that.</span><button class="btn">Save changes</button></div></form>`:""}
 <div class="grid" style="grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-bottom:12px"><div class="row" style="gap:8px;flex-wrap:nowrap"><input type="search" data-live="hvq" value="${esc(f.q)}" placeholder="Search hive ID, status or apiary" aria-label="Search hives" style="flex:1"><select data-chg="hvap" aria-label="Apiary" style="width:auto"><option value="All">All apiaries</option>${D.apiaries.map(a=>`<option value="${a.id}" ${f.ap===a.id?"selected":""}>${esc(a.name)}</option>`).join("")}</select></div>
  <div class="seg">${["All","Healthy","Needs attention"].map(x=>`<button class="${f.st===x?"on":""}" data-act="hvst" data-v="${x}">${x}</button>`).join("")}</div></div>
 <div class="card" style="padding:0;overflow-x:auto"><table><tr><th>Hive ID</th><th>Apiary</th><th>Type</th><th>Queen</th><th>Status</th><th>Brood</th><th>Last inspected</th><th style="text-align:right">Actions</th></tr>
 ${rows.map(({h,a})=>`<tr class="${edit&&edit.h.id===h.id?"hl":""}"><td class="num"><b>${h.id}</b></td><td>${esc(a.name)}</td><td>${h.type}</td><td>${h.q}</td><td><span class="tag ${h.st==="Healthy"?"ok":h.st==="Alert"||h.st==="Queenless"?"bad":"hn"}">${h.st}</span></td><td class="num">${h.f}/10</td><td class="num">${h.last}</td><td style="text-align:right;white-space:nowrap"><a class="btn o sbtn" href="#/inspect/${h.id}">Inspect</a> <button class="btn o sbtn" data-act="hvedit" data-v="${h.id}">Edit</button> <button class="btn g sbtn" data-act="hvdel" data-v="${h.id}" aria-label="Remove ${h.id}">✕</button></td></tr>`).join("")||`<tr><td colspan="8"><div class="empty">No hives match these filters.</div></td></tr>`}
 </table></div>`;
}

ACTS.hvedit=t=>{HV().edit=t.dataset.v;route()};
ACTS.hvcancel=()=>{HV().edit=null;route()};
ACTS.hvst=t=>{HV().st=t.dataset.v;route()};
ACTS.hvdel=t=>{const r=findHive(t.dataset.v);if(!r)return;if(!confirm("Remove hive "+r.h.id+"? This cannot be undone."))return;r.a.hives=r.a.hives.filter(h=>h.id!==r.h.id);if(HV().edit===r.h.id)HV().edit=null;if(V.sel===r.h.id)V.sel=null;log("Removed hive "+r.h.id);persist();toast("Removed "+r.h.id);route()};
LIVE.hvq=t=>{HV().q=t.value;const p=t.selectionStart;route();const n=document.querySelector('[data-live="hvq"]');if(n){n.focus();n.setSelectionRange(p,p)}};
document.addEventListener("change",e=>{if(e.target.dataset.chg==="hvap"){HV().ap=e.target.value;route()}});
FORMS.edithive=f=>{const r=findHive(HV().edit);if(!r)return toast("Hive not found",true);
 const fr=parseInt(f.f.value,10);if(isNaN(fr)||fr<0||fr>10)return toast("Brood frames must be 0 to 10",true);
 Object.assign(r.h,{type:f.type.value,q:f.q.value,st:f.st.value,f:fr});log("Updated hive "+r.h.id);persist();HV().edit=null;toast("Hive updated");route()};
FORMS.addhive2=f=>{const a=findApiary(f.apiary.value);if(!a)return toast("Choose an apiary",true);const n=parseInt(f.n.value,10);
 if(!Number.isInteger(n)||n<1||n>20)return toast("Enter a number from 1 to 20",true);if(a.hives.length+n>50)return toast("An apiary can hold up to 50 hives",true);
 for(let i=0;i<n;i++){const id="AB-"+new Date().getFullYear()+"-"+String(D.seq++).padStart(4,"0");a.hives.push({id,type:f.type.value,q:"Medium",st:"Healthy",f:5,last:today(),health:80,prod:50,x:20+(a.hives.length*13)%60,y:25+(a.hives.length*17)%55})}
 log("Added "+n+" hive"+(n>1?"s":"")+" to "+a.name);persist();HV().add=false;toast("Added "+n+" hive"+(n>1?"s":""));route()};

/* ===== Tasks ===== */
const TK=()=>V.tk||(V.tk={f:"Open",pre:null});
function tasksPage(){
 const s=TK(),pre=s.pre||{};
 const list=D.tasks.filter(t=>s.f==="All"||(s.f==="Open"?!t.done:t.done)).sort((a,b)=>(a.done-b.done)||(a.due<b.due?-1:1));
 const apName=id=>(findApiary(id)||{}).name||"—";
 return `<div class="page-h"><div><h1>Tasks</h1><p class="mut" style="margin:6px 0 0">${openTasks()} open. Create follow-up work from an inspection or apiary, and assign it to a team member.</p></div>
  <div class="seg">${["Open","Done","All"].map(x=>`<button class="${s.f===x?"on":""}" data-act="tkf" data-v="${x}">${x}</button>`).join("")}</div></div>
 <div class="grid" style="grid-template-columns:minmax(0,1fr) 340px;align-items:start">
  <div class="card" style="padding:0"><table><tr><th style="width:40px"></th><th>Task</th><th>Apiary / hive</th><th>Assignee</th><th>Due</th><th>Priority</th><th></th></tr>
  ${list.map(t=>`<tr><td><input type="checkbox" data-chg="tdone" data-v="${t.id}" ${t.done?"checked":""} aria-label="Mark ${esc(t.title)} done"></td><td style="${t.done?"text-decoration:line-through;color:var(--mut)":""}"><b>${esc(t.title)}</b></td><td class="sm">${esc(apName(t.apiary))}${t.hive?` · <a href="#/inspect/${t.hive}" style="color:#8a5d00;font-weight:700">${t.hive}</a>`:""}</td><td class="sm">${esc(t.assignee||"Unassigned")}</td><td class="num sm">${esc(t.due)}</td><td><span class="tag ${t.prio==="High"?"bad":t.prio==="Medium"?"hn":""}">${t.prio}</span></td><td><button class="btn g sbtn" data-act="tdel" data-v="${t.id}" aria-label="Delete task">✕</button></td></tr>`).join("")||`<tr><td colspan="7"><div class="empty">No ${s.f==="All"?"":s.f.toLowerCase()+" "}tasks.</div></td></tr>`}
  </table></div>
  <form class="card stack" data-form="addtask" novalidate><h3>New task</h3>
   <div><label class="f" for="tt">Title *</label><input id="tt" name="title" required maxlength="120" value="${esc(pre.title||"")}" placeholder="e.g. Treat mites in Apiary 1"></div>
   <div><label class="f" for="ta">Apiary</label><select id="ta" name="apiary"><option value="">None</option>${D.apiaries.map(a=>`<option value="${a.id}" ${pre.apiary===a.id?"selected":""}>${esc(a.name)}</option>`).join("")}</select></div>
   <div><label class="f" for="th">Hive ID (optional)</label><input id="th" name="hive" value="${esc(pre.hive||"")}" placeholder="AB-2026-0042"></div>
   <div class="two" style="gap:0 10px"><div><label class="f" for="tdue">Due date *</label><input id="tdue" name="due" type="date" value="${pre.due||""}" required></div><div><label class="f" for="tp">Priority</label><select id="tp" name="prio">${["High","Medium","Low"].map(p=>`<option ${p==="Medium"?"selected":""}>${p}</option>`).join("")}</select></div></div>
   <div><label class="f" for="tas">Assign to</label><select id="tas" name="assignee"><option value="">Unassigned</option>${D.team.map(m=>`<option>${esc(m.name)}</option>`).join("")}</select></div>
   <button class="btn block">Create task</button>${pre.title?`<button type="button" class="btn g block sbtn" data-act="tclear">Clear prefill</button>`:""}
  </form></div>`;
}
ACTS.tkf=t=>{TK().f=t.dataset.v;route()};
ACTS.tdel=t=>{if(!confirm("Delete this task?"))return;D.tasks=D.tasks.filter(x=>x.id!==t.dataset.v);persist();toast("Task deleted");route()};
ACTS.tclear=()=>{TK().pre=null;route()};
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.chg==="tdone"){const k=D.tasks.find(x=>x.id===t.dataset.v);if(k){k.done=t.checked;log((k.done?"Completed task: ":"Reopened task: ")+k.title);persist();route()}}});
FORMS.addtask=f=>{const title=f.title.value.trim();if(!title)return toast("Enter a task title",true);if(!f.due.value)return toast("Choose a due date",true);
 const hive=f.hive.value.trim();if(hive&&!findHive(hive))return toast("Hive ID not found. Leave it blank or check the ID",true);
 D.tasks.push({id:uid("t"),title,apiary:f.apiary.value||(hive?findHive(hive).a.id:""),hive:hive,due:f.due.value,assignee:f.assignee.value,prio:f.prio.value,done:false});
 log("Task created: "+title);persist();TK().pre=null;toast("Task created");route()};
ACTS.mktask=t=>{const r=findHive(t.dataset.v);if(!r)return;TK().pre={title:"Follow-up: "+r.h.id,apiary:r.a.id,hive:r.h.id,due:""};go("#/tasks")};
ACTS.schedsite=t=>{const a=findApiary(t.dataset.v);TK().pre={title:"Site inspection: "+a.name,apiary:a.id,hive:"",due:""};go("#/tasks")};

/* ===== Settings ===== */
function settingsPage(){
 const o=D.org||{name:"",type:"Honey Producer",cur:"TZS",tax:"",logo:""};
 return `<div class="page-h"><div><h1>Settings</h1><p class="mut" style="margin:6px 0 0">Organization profile, team and your data.</p></div><button class="btn o" data-act="signout">Sign out</button></div>
 <div class="grid g2" style="align-items:start">
  <form class="card" data-form="orgsave" novalidate><h3>Organization profile</h3>
   <label class="drop" for="setlogo" style="margin-top:12px"><input id="setlogo" type="file" accept="image/png,image/jpeg,image/svg+xml" style="display:none">${o.logo?`<img src="${o.logo}" alt="Organization logo">`:`<div style="font-size:24px">⬆</div>`}<b>${o.logo?"Change logo":"Upload logo"}</b><div class="sm mut">PNG, JPG or SVG up to 2 MB</div></label>
   <label class="f" for="on">Organization name *</label><input id="on" name="name" value="${esc(o.name)}" required maxlength="80">
   <div class="two"><div><label class="f" for="ot">Type</label><select id="ot" name="type">${["Honey Producer","Equipment Supplier","Cooperative","Retailer"].map(v=>`<option ${o.type===v?"selected":""}>${v}</option>`).join("")}</select></div>
   <div><label class="f" for="oc">Default currency</label><select id="oc" name="cur">${[["TZS","Tanzanian Shilling (TSh)"],["KES","Kenyan Shilling (KSh)"],["UGX","Ugandan Shilling (USh)"],["USD","US Dollar ($)"]].map(v=>`<option value="${v[0]}" ${o.cur===v[0]?"selected":""}>${v[1]}</option>`).join("")}</select></div></div>
   <label class="f" for="otx">Tax ID / PIN (optional)</label><input id="otx" name="tax" value="${esc(o.tax||"")}">
   <div class="row" style="margin-top:14px"><span class="sm mut">Currency changes apply to new figures only.</span><button class="btn">Save profile</button></div></form>
  <div class="stack">
   <div class="card"><div class="row"><h3>Team</h3><span class="sm mut">${D.team.length} members</span></div>
    <table style="margin-top:8px">${D.team.map(m=>`<tr><td><b>${esc(m.name)}</b><div class="sm mut">${esc(m.email)}</div></td><td><select data-chg="mrole" data-v="${m.id}" aria-label="Role for ${esc(m.name)}" style="width:auto">${ROLES.map(r=>`<option ${m.role===r?"selected":""}>${r}</option>`).join("")}</select></td><td style="text-align:right"><button class="btn g sbtn" data-act="mdel" data-v="${m.id}" aria-label="Remove ${esc(m.name)}">✕</button></td></tr>`).join("")}</table>
    <form data-form="addmember" novalidate class="stack" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px"><b class="sm">Invite a team member (saved to your account; no email is sent)</b>
     <div class="two" style="gap:0 10px"><div><label class="f" for="mn">Name *</label><input id="mn" name="name" required></div><div><label class="f" for="me">Email *</label><input id="me" name="email" type="email" required></div></div>
     <div class="row"><select name="role" aria-label="Role" style="width:auto;flex:1">${ROLES.map(r=>`<option>${r}</option>`).join("")}</select><button class="btn">Add member</button></div></form></div>
   <div class="card"><h3>Your data</h3><p class="sm mut">Your data is saved to your account on this server. Deleting it cannot be undone.</p><button class="btn o" data-act="resetdemo">Delete all my data</button></div>
  </div></div>`;
}
FORMS.orgsave=f=>{const name=f.name.value.trim();if(!name)return toast("Enter an organization name",true);
 D.org=Object.assign({type:"Honey Producer",cur:"TZS",tax:"",logo:""},D.org||{},{name,type:f.type.value,cur:f.cur.value,tax:f.tax.value.trim()});persist();log("Updated organization profile");toast("Profile saved");route()};
document.addEventListener("change",e=>{const t=e.target;
 if(t.id==="setlogo"){const f=t.files[0];if(!f)return;if(f.size>2*1024*1024)return toast("Logo must be 2 MB or smaller",true);const r=new FileReader();r.onload=()=>{D.org=D.org||{name:"",type:"Honey Producer",cur:"TZS",tax:""};D.org.logo=r.result;persist();toast("Logo updated");route()};r.onerror=()=>toast("Could not read that file",true);r.readAsDataURL(f)}
 if(t.dataset.chg==="mrole"){const m=D.team.find(x=>x.id===t.dataset.v);if(m){m.role=t.value;log("Changed "+m.name+" to "+m.role);persist();toast("Role updated")}}
});
FORMS.addmember=f=>{const name=f.name.value.trim(),email=f.email.value.trim();if(!name)return toast("Enter a name",true);if(!emailOk(email))return toast("Enter a valid email",true);
 if(D.team.some(m=>m.email.toLowerCase()===email.toLowerCase()))return toast("That email is already on the team",true);
 D.team.push({id:uid("m"),name,email,role:f.role.value});log("Added team member "+name);persist();toast(name+" added");route()};
ACTS.mdel=t=>{const m=D.team.find(x=>x.id===t.dataset.v);if(!m)return;if(m.role==="Owner"&&D.team.filter(x=>x.role==="Owner").length<2)return toast("Keep at least one owner",true);if(!confirm("Remove "+m.name+" from the team?"))return;D.team=D.team.filter(x=>x!==m);log("Removed "+m.name);persist();toast("Removed "+m.name);route()};
ACTS.resetdemo=()=>{if(!confirm("Delete all your apiaries, hives, stock, sales and tasks? This cannot be undone."))return;const u=D.user;D=clone(EMPTY);D.user=u;ensureDefaults();persist();toast("All your data was deleted");route()};
ACTS.signout=()=>signOut();

/* ===== Seller application ===== */
function sellerPage(){
 const s=D.seller;
 if(s)return `<div class="card" style="max-width:640px;margin:0 auto"><span class="tag hn">${esc(s.status)}</span><h1 style="margin-top:10px">${esc(s.biz)}</h1><p class="mut">Application received on ${s.at}. Applications are saved to your account. Reviews are not connected yet.</p><div class="sm" style="margin-top:12px"><b>Region:</b> ${esc(s.region)}<br><b>Contact:</b> ${esc(s.phone)}<br><b>Categories:</b> ${s.cats.map(esc).join(", ")}</div><div class="row" style="margin-top:16px"><a class="btn o" href="#/market">Back to marketplace</a><button class="btn g sbtn" data-act="sellerreset">Submit a different application</button></div></div>`;
 return `<div class="page-h"><div><h1>Become a seller</h1><p class="mut" style="margin:6px 0 0">List honey, wax or equipment on the Waggle marketplace. Applications are reviewed before listings go live.</p></div></div>
 <form class="card" data-form="seller" novalidate style="max-width:760px"><div class="two"><div><label class="f" for="sb">Business name *</label><input id="sb" name="biz" required maxlength="80"></div><div><label class="f" for="sp">Contact phone *</label><input id="sp" name="phone" required placeholder="+255 7XX XXX XXX"></div>
 <div><label class="f" for="sr">Region *</label><select id="sr" name="region">${["Njombe","Moshi","Arusha","Dodoma","Morogoro","Tabora","Dar es Salaam","Other"].map(r=>`<option>${r}</option>`).join("")}</select></div></div>
 <label class="f">Product categories *</label><div class="opts" style="gap:14px">${["Honey","Wax","Hives","Equipment","Protective Gear","Health"].map(c=>`<label class="ck"><input type="checkbox" name="cats" value="${c}"> ${c}</label>`).join("")}</div>
 <label class="f" for="sd">About your business (20+ characters) *</label><textarea id="sd" name="desc" rows="4" maxlength="600"></textarea>
 <div class="row" style="margin-top:14px"><span class="sm mut">Applications are saved to your account. Publishing is not connected yet.</span><button class="btn">Submit application</button></div></form>`;
}
ACTS.sellerreset=()=>{D.seller=null;persist();route()};
FORMS.seller=f=>{const biz=f.biz.value.trim(),phone=f.phone.value.trim(),desc=f.desc.value.trim(),cats=[...f.querySelectorAll('input[name="cats"]:checked')].map(x=>x.value);
 if(!biz)return toast("Enter your business name",true);if(!/^\+?[0-9 ]{9,16}$/.test(phone))return toast("Enter a valid phone number",true);
 if(!cats.length)return toast("Choose at least one category",true);if(desc.length<20)return toast("Describe your business in at least 20 characters",true);
 D.seller={biz,phone,region:f.region.value,cats,desc,status:"Under review",at:today()};log("Seller application from "+biz);persist();toast("Application submitted");route()};

function ensureDefaults(){
 for(const k of Object.keys(EMPTY)){if(D[k]===undefined)D[k]=clone(EMPTY[k])}

}

 try{await API.call("POST","/api/logout")}catch(e){}
 clearTimeout(SAVE_T);SAVE_PENDING=false;D=clone(EMPTY);

 <div class="grid g2" style="margin-top:16px"><div class="card" style="background:var(--honey-soft);border-color:#f0d27a"><b>Low-stock protocol</b><p class="sm mut" style="margin:6px 0 0">${low.length} item${low.length===1?"":"s"} at or below minimum. Restock from your supplier and record the received quantity with +10 or a new product.</p></div><div class="card"><b>Batch traceability</b><p class="sm mut" style="margin:6px 0 0">Batch codes link products back to their apiary origin. Full traceability reports are not built yet.</p></div></div>`;
}
ACTS.addptog=()=>{IV().addP=!IV().addP;route()};
ACTS.ifilter=t=>{IV().filter=t.dataset.v;route()};
ACTS.restock=t=>{const p=D.inv.find(x=>x.id===t.dataset.v);if(!p)return;p.qty+=10;log("Restocked 10 "+p.name);persist();toast("Restocked 10 units");route()};
ACTS.ptoggle=t=>{const p=D.inv.find(x=>x.id===t.dataset.v);if(!p)return;p.pub=!p.pub;log((p.pub?"Published ":"Unpublished ")+p.name);persist();toast(p.pub?"Now listed online":"Removed from online listing");route()};
ACTS.exportinv=()=>{const csv="SKU,Name,Category,Location,Qty,Min,Price (TSh)\n"+D.inv.map(p=>[p.sku,'"'+p.name.replace(/"/g,'""')+'"',p.cat,p.loc,p.qty,p.min,p.price].join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="inventory.csv";a.click();toast("Downloaded inventory.csv")};
LIVE.iq=t=>{IV().q=t.value;const p=t.selectionStart;route();const n=document.querySelector('[data-live="iq"]');if(n){n.focus();n.setSelectionRange(p,p)}};
document.addEventListener("change",e=>{if(e.target.dataset.chg==="icat"){IV().cat=e.target.value;route()}});
FORMS.addproduct=f=>{const name=f.name.value.trim(),price=+f.price.value,qty=parseInt(f.qty.value,10),min=parseInt(f.min.value,10);
 if(!name)return toast("Enter a product name",true);if(!(price>0))return toast("Enter a price above 0",true);if(!(qty>=0)||!(min>=0))return toast("Quantities cannot be negative",true);
 if(D.inv.some(p=>p.name.toLowerCase()===name.toLowerCase()))return toast("A product with this name already exists",true);
 const icons={Honey:"🍯",Wax:"🕯️",Hives:"📦",Equipment:"🔧","Protective Gear":"🥼",Health:"🧴"};
 D.inv.push({id:uid("p"),name,sku:f.sku.value.trim()||("SKU-"+(D.inv.length+1)),cat:f.cat.value,price,qty:isNaN(qty)?0:qty,min:isNaN(min)?5:min,loc:"Main store",icon:icons[f.cat.value]||"📦",exp:"",batch:"",pub:!!f.pub.checked,desc:""});
 log("Added product "+name);persist();IV().addP=false;toast("Product saved");route()};

/* ===== POS ===== */
const VAT=0.18;
const PS=()=>V.ps||(V.ps={q:"",cat:"All",cust:"",pay:"Cash",receipt:null});
function posPage(){
 const s=PS(),cats=["All",...new Set(D.inv.map(p=>p.cat))];
 const items=D.inv.filter(p=>(s.cat==="All"||p.cat===s.cat)&&(!s.q||(p.name+" "+p.sku).toLowerCase().includes(s.q.toLowerCase())));
 const sub=posSub(),vat=Math.round(sub*VAT),tot=sub+vat;
 if(s.receipt)return posReceipt(s.receipt);
 return `<div class="page-h"><div><h1>Point of sale</h1><p class="mut" style="margin:6px 0 0">Ring up farm-gate and walk-in sales. Each sale reduces stock.</p></div><span class="tag bl">Records saved to your account</span></div>
 <div class="pos"><div>
  <div class="row" style="gap:10px;margin-bottom:12px"><input type="search" data-live="pq" value="${esc(s.q)}" placeholder="Search products or SKU" aria-label="Search products" style="flex:1"></div>
  <div class="row" style="gap:8px;justify-content:flex-start;margin-bottom:14px">${cats.map(c=>`<button class="chip ${s.cat===c?"on":""}" data-act="pcat" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div>
  <div class="pgrid-pos">${items.map(p=>{const inC=(D.pcart||[]).find(c=>c.id===p.id);const left=p.qty-(inC?inC.n:0);return `<button class="card ptile" data-act="padd" data-v="${p.id}" ${left<=0?"disabled":""} aria-label="Add ${esc(p.name)}"><div class="pimg" style="background:#f3efe4">${p.icon||"📦"}</div><div style="padding:10px 12px"><div class="cat">${esc(p.cat)}</div><b style="font-size:13.5px">${esc(p.name)}</b><div class="row" style="margin-top:6px"><span class="price num" style="font-size:14px;color:#8a5d00">${TZS(p.price)}</span><span class="tag ${left<=5?"bad":"ok"}">${left} in stock</span></div></div></button>`}).join("")||`<div class="empty card" style="grid-column:1/-1">No products match. Clear the search or add products in Inventory.</div>`}</div>
 </div>
 <aside class="pos-side" aria-label="Checkout">
  <div class="body"><div class="row"><h3>Checkout summary</h3><span class="tag">Walk-in</span></div>
   <label class="f" for="pcust">Customer (optional)</label><input id="pcust" data-live="pcust" value="${esc(s.cust)}" placeholder="Walk-in customer">
   <div style="margin-top:12px">${(D.pcart||[]).length?(D.pcart||[]).map(c=>{const p=D.inv.find(x=>x.id===c.id)||{name:"Removed",price:0};return `<div class="cart-line"><div style="min-width:0"><b class="sm">${esc(p.name)}</b><div class="sm mut">${TZS(p.price)}</div></div><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="qty"><button data-act="pq" data-v="${c.id}|-1" aria-label="Decrease">−</button><span>${c.n}</span><button data-act="pq" data-v="${c.id}|1" aria-label="Increase">+</button></div><button class="btn g sbtn" data-act="prm" data-v="${c.id}" aria-label="Remove">✕</button></div></div>`}).join(""):`<div class="empty" style="padding:24px 8px">Your cart is empty.<br>Tap a product to start a sale.</div>`}</div>
  </div>
  <div class="foot">
   <div class="row sm"><span class="mut">Subtotal</span><span class="num">${TZS(sub)}</span></div>
   <div class="row sm"><span class="mut">VAT (18%)</span><span class="num">${TZS(vat)}</span></div>
   <div class="row"><b>Total</b><b class="num" style="font-size:20px">${TZS(tot)}</b></div>
   <div class="pm" role="group" aria-label="Payment method">${["Cash","M-Pesa","Card"].map(m=>`<button class="${s.pay===m?"on":""}" data-act="ppay" data-v="${m}" aria-pressed="${s.pay===m}">${m}</button>`).join("")}</div>
   <p class="sm mut" style="margin:0">${s.pay==="Cash"?"Cash is recorded when you confirm.":s.pay+" is recorded only. No payment gateway is connected, so verify it yourself."}</p>
   <button class="btn dk block" data-act="charge" ${(D.pcart||[]).length?"":"disabled"} id="chargebtn">Complete sale · ${TZS(tot)}</button>
   <button class="btn o block sbtn" data-act="pclear" ${(D.pcart||[]).length?"":"disabled"}>Clear sale</button>
  </div>
 </aside></div>`;
}
function posSub(){return (D.pcart||[]).reduce((s,c)=>{const p=D.inv.find(x=>x.id===c.id);return s+(p?p.price*c.n:0)},0)}
function posReceipt(r){return `<div class="card" style="max-width:460px;margin:0 auto"><div class="row"><h2>Sale complete</h2><span class="tag ok">Saved</span></div><p class="mut sm">Receipt ${r.no} · ${r.date} ${r.time}</p>
 <div class="receipt" style="margin-top:12px">Waggle${D.org?" · "+esc(D.org.name):""}<br>Receipt: ${r.no}<br>Customer: ${esc(r.cust)}<br>Payment: ${esc(r.pay)}<br>────────────────<br>${r.lines.map(l=>`${esc(l.name)}<br>&nbsp;&nbsp;${l.n} × ${TZS(l.price)} = ${TZS(l.n*l.price)}`).join("<br>")}<br>────────────────<br>Subtotal ${TZS(r.sub)}<br>VAT 18% ${TZS(r.vat)}<br><b>Total ${TZS(r.total)}</b>${r.pay!=="Cash"?"<br><span style='font-size:11px'>"+esc(r.pay)+" recorded, not verified by a payment gateway.</span>":""}</div>
 <div class="row" style="margin-top:16px"><button class="btn o" data-act="print">Print receipt</button><button class="btn" data-act="newsale">New sale</button></div></div>`}
ACTS.pcat=t=>{PS().cat=t.dataset.v;route()};
ACTS.padd=t=>{const p=D.inv.find(x=>x.id===t.dataset.v);if(!p)return;D.pcart=D.pcart||[];const c=D.pcart.find(x=>x.id===p.id);const n=c?c.n:0;if(n+1>p.qty)return toast("Only "+p.qty+" in stock",true);if(c)c.n++;else D.pcart.push({id:p.id,n:1});persist();route()};
ACTS.pq=t=>{const[id,d]=t.dataset.v.split("|");const c=(D.pcart||[]).find(x=>x.id===id);const p=D.inv.find(x=>x.id===id);if(!c||!p)return;const n=c.n+ +d;if(n<1)return;if(n>p.qty)return toast("Only "+p.qty+" in stock",true);c.n=n;persist();route()};
ACTS.prm=t=>{D.pcart=(D.pcart||[]).filter(c=>c.id!==t.dataset.v);persist();route()};
ACTS.pclear=()=>{D.pcart=[];persist();route()};
ACTS.ppay=t=>{PS().pay=t.dataset.v;route()};
LIVE.pq=t=>{PS().q=t.value;const p=t.selectionStart;route();const n=document.querySelector('[data-live="pq"]');if(n){n.focus();n.setSelectionRange(p,p)}};
LIVE.pcust=t=>{PS().cust=t.value};
let CHARGING=false;
ACTS.charge=()=>{
 if(CHARGING)return;CHARGING=true;
 try{
  const cart=D.pcart||[];if(!cart.length)return toast("Add a product first",true);
  for(const c of cart){const p=D.inv.find(x=>x.id===c.id);if(!p)return toast("A product in the sale was removed",true);if(c.n>p.qty)return toast(p.name+": only "+p.qty+" in stock",true)}
  const sub=posSub(),vat=Math.round(sub*VAT),total=sub+vat,s=PS();
  const no="RCP-"+(D.seq++),now=new Date();
  const lines=cart.map(c=>{const p=D.inv.find(x=>x.id===c.id);p.qty-=c.n;return {name:p.name,n:c.n,price:p.price}});
  const rec={no,date:today(),time:now.toTimeString().slice(0,5),cust:(s.cust||"").trim()||"Walk-in",pay:s.pay,lines,sub,vat,total};
  D.sales.unshift(rec);D.sales=D.sales.slice(0,200);
  D.orders.unshift({id:no,cust:rec.cust,date:rec.date,amt:total,st:"Completed",items:[]});
  log("POS sale "+no+" "+TZS(total)+" ("+s.pay+")");
  D.pcart=[];persist();s.receipt=rec;s.cust="";toast("Sale "+no+" recorded");route();
 }finally{CHARGING=false}
};
ACTS.print=()=>window.print();
ACTS.newsale=()=>{PS().receipt=null;route()};

/* ===== Global search (topbar) ===== */
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="gsearch"){const q=e.target.value.trim();if(!q)return;const f=MF();f.q=q;f.page=1;f.cat="All";go("#/market")}});

/* ===== Init ===== */
const _dashPage=dashPage;
dashPage=function(){AFTER=afterWeather;return _dashPage()};
boot();

</script>
</body>
</html>
